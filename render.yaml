services:
  - type: web
    name: logos-agency-mvp-dashboard
    runtime: node
    plan: standard
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_FRONTEND_FORGE_API_URL
        scope: build
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        scope: build
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        scope: build
        sync: false
      - key: VITE_GITHUB_CLIENT_ID
        scope: build
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /
    headers:
      - path: /
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - path: /
        destination: /index.html
